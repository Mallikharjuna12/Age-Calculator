<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎂 Age Calculator</h1>

    <p>Select your Date of Birth</p>

    <input type="date" id="dob">

    <button onclick="calculateAge()">
        Calculate Age
    </button>

    <div class="result">

        <h2>Your Age</h2>

        <div class="cards">

            <div class="card">
                <h3 id="years">0</h3>
                <p>Years</p>
            </div>

            <div class="card">
                <h3 id="months">0</h3>
                <p>Months</p>
            </div>

            <div class="card">
                <h3 id="days">0</h3>
                <p>Days</p>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
